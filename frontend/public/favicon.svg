  <rect width="100" height="100" rx="18" fill="#0f4a36"/>
  <rect x="30" y="10" width="40" height="80" rx="6" fill="#1a202c" stroke="#d4af37" stroke-width="3.5"/>
  <line x1="34" y1="50" x2="66" y2="50" stroke="#d4af37" stroke-width="3"/>
  <g fill="#fef3c7">
    <circle cx="42" cy="21" r="3.6"/><circle cx="58" cy="21" r="3.6"/>
    <circle cx="42" cy="32" r="3.6"/><circle cx="58" cy="32" r="3.6"/>
    <circle cx="42" cy="43" r="3.6"/><circle cx="58" cy="43" r="3.6"/>
    <circle cx="42" cy="57" r="3.6"/><circle cx="58" cy="57" r="3.6"/>
    <circle cx="42" cy="68" r="3.6"/><circle cx="58" cy="68" r="3.6"/>
    <circle cx="42" cy="79" r="3.6"/><circle cx="58" cy="79" r="3.6"/>
  </g>
</svg>
